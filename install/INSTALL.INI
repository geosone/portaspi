; INSTALL.INI for the GeosOne DOS Installer (INSTALL.EXE, from
; https://github.com/geosone/gdi, GPL version 3; its license is GPL3.TXT)
[Setup]
Title=PORTASPI Setup
Product=GeosOne PORTASPI 0.6
Id=PORTASPI
License=1,2,3
License1=PORTASPI, OpenASPI|LICENSE.TXT
License2=SHSUCDX, CDAUDIO|SHSUCD.LIC
License3=Setup (GDI)|GPL3.TXT
Readme=README.TXT
; the drivers in C:\OPENASPI with AHCIASPI, EUSBASPI and OpenASPI; this
; installer and its journals in C:\OPENASPI\PORTASPI
DefaultDir=%BOOT%\OPENASPI
SetupDir=PORTASPI
Done=PORTASPI is installed; the OpenASPI drivers chosen are loaded after it in CONFIG.SYS. Restart the computer.

[Welcome]
PORTASPI is an ASPI manager (SCSIMGR$) for parallel port drives - ZIP,
SuperDisk LS-120, BackPack CD-ROM, floppy drive and hard disk, and the
drives behind OnSpec, Shuttle and Freecom adapters - and for floppy
tape drives (QIC-80, QIC-3010/3020, Iomega Ditto). ASPI drivers use
the drives through it.

The OpenASPI drivers come with it: ASPICDA.SYS (CD-ROM, with SHSUCDX
for the drive letter), ASPIFDD.SYS (ZIP, LS-120, floppy), ASPIDSK.SYS
(hard disks) and ASPITAP.SYS (tape). Setup copies PORTASPI and the
drivers you choose to your hard disk and adds them to CONFIG.SYS.

[Options]
Option=on|Load PORTASPI.SYS in CONFIG.SYS
Option=off|Load it into upper memory (DEVICEHIGH)|HIGH
Option=off|A floppy tape drive on the floppy controller, B: line (/F)| /F
Option=on|CD-ROM drives: ASPICDA.SYS, SHSUCDX instead of MSCDEX or NWCDEX
Option=on|ZIP, LS-120, BackPack floppy drive: ASPIFDD.SYS
Option=?DISK|Hard disks behind a parallel port adapter: ASPIDSK.SYS
Option=?TAPE|Tape drives (floppy tape, Ditto): ASPITAP.SYS
Option=on|Add the installation directory to the PATH (ASPISCAN, TAPECTL from any directory)

; with PORTASPI already loaded (a new setup), the devices found
; preselect the options
[Detect]
DISK=ASPISCAN.COM /Q /DISK
TAPE=ASPISCAN.COM /Q /TAPE

; the CD-ROM extension: SHSUCDX of this disk comes first (MSCDEX of MS-DOS,
; NWCDEX of DR-DOS only when a distributor took SHSUCDX off the disk)
[Find]
CDEX=SHSUCDX.COM SHSUCDX.EXE MSCDEX.EXE NWCDEX.EXE

[Files]
PORTASPI.SYS
ASPISCAN.COM
README.TXT=PORTASPI.TXT
LICENSE.TXT
GPL3.TXT
4|ASPICDA.SYS
4|CDAUDIO.COM
4|SHSUCD.LIC
4|SHSUCD.TXT
5|ASPIFDD.SYS
6|ASPIDSK.SYS
7|ASPITAP.SYS
7|TAPECTL.COM

[Config.sys]
Remove=PORTASPI.SYS
Add=1|DEVICE%O2%=%DIR%\PORTASPI.SYS%O3%
; the OpenASPI drivers after PORTASPI
Remove=ASPICDA.SYS
Remove=ASPIFDD.SYS
Remove=ASPIDSK.SYS
Remove=ASPITAP.SYS
Add=1,4|DEVICE%O2%=%DIR%\ASPICDA.SYS /D:ASPICDA0
Add=1,5|DEVICE%O2%=%DIR%\ASPIFDD.SYS
Add=1,6|DEVICE%O2%=%DIR%\ASPIDSK.SYS
Add=1,7|DEVICE%O2%=%DIR%\ASPITAP.SYS

; SHSUCDX in the place of MSCDEX or NWCDEX (INSTALL /U puts them back);
; ASPICDA0 to that line, else a new one
[Autoexec.bat]
Program=1,4,?CDEX|MSCDEX,NWCDEX,SHSUCDX|%CDEX%
Extend=1,4,?CDEX|MSCDEX,NWCDEX,SHSUCDX| /D:ASPICDA0|%CDEX% /D:ASPICDA0 /A:AUTO
PathAppend=8|%DIR%
Position=bottom
